[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "materialsatlas"
version = "0.1.0"
description = "Python access to MaterialsAtlas property datasets, CIF exports, and OPTIMADE structures"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "MaterialsAtlas"}]
keywords = ["materials-science", "datasets", "crystallography", "OPTIMADE", "CIF"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
data = ["pandas>=2,<4", "pyarrow>=15"]
structures = ["pymatgen>=2024.1"]
test = ["pytest>=8", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://materialsatlas.org/data-downloads/"
Documentation = "https://materialsatlas.org/data-downloads/guide.html"
Source = "https://github.com/usccolumbia/matverse/tree/main/python/materialsatlas"
Issues = "https://github.com/usccolumbia/matverse/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/materialsatlas"]
