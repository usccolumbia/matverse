    location /api/data/v1/ {
        limit_req zone=materials_data_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8094;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180;
    }
    location /optimade/ {
        limit_req zone=materials_data_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8094;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180;
    }
    location = /data-downloads { return 301 /data-downloads/; }
    location /data-downloads/ {
        proxy_pass http://127.0.0.1:8094;
        proxy_set_header Host $host;
    }
    location /_materials_data/ {
        internal;
        alias /data/materialsatlas-data/;
        limit_conn materials_data_connections 6;
        limit_conn_status 429;
        sendfile on;
        aio threads;
        max_ranges 1;
    }
