name: Validate catalog
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate evidence fields and generated views
        run: python scripts/build_catalog.py --check
      - name: Check local links
        run: python scripts/check_local_links.py
      - name: Verify HTML and source-index generation
        run: |
          python scripts/build_site.py --check
          python scripts/build_sources.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check search, filters, sorting and exports
        run: node --test tests/ui.test.cjs
